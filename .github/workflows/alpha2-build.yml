name: Build VTuberCore alpha.2 daily core

on:
  push:
    branches:
      - feature/0.1.0-alpha.2-daily-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Compile and test
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify reusable alpha.2
        shell: bash
        run: |
          set -euxo pipefail
          jar='build/libs/vtubercore-0.1.0-alpha.2.jar'
          test -f "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '"id": "vtubercore"'
          unzip -p "$jar" fabric.mod.json | grep -q '0.1.0-alpha.2'
          test -f src/main/java/com/vtubercore/data/PlayerData.java
          test -f src/main/java/com/vtubercore/economy/EconomyService.java
          test -f src/main/java/com/vtubercore/rewards/DailyLoginService.java
          test -f src/main/java/com/vtubercore/config/GuiThemeConfig.java
          test -f tools/generate_preset.py
          ! grep -R -E 'Michicoins|Gasha Especial de Emi|Profesora Emi|Emipokemon' src/main/java src/main/resources
          sha256sum "$jar" > SHA256SUMS-0.1.0-alpha.2.txt
          cat SHA256SUMS-0.1.0-alpha.2.txt
      - name: Package source
        run: git archive --format=zip --output=VTuberCore-0.1.0-alpha.2-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: VTuberCore-0.1.0-alpha.2-daily-core
          path: |
            build/libs/vtubercore-0.1.0-alpha.2.jar
            build/libs/vtubercore-0.1.0-alpha.2-sources.jar
            VTuberCore-0.1.0-alpha.2-source.zip
            SHA256SUMS-0.1.0-alpha.2.txt
            CHANGELOG-0.1.0-alpha.2.md
            GUIA-PRUEBAS-0.1.0-alpha.2.md
